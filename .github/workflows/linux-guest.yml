name: Linux guest regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-guest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify toolchain and record execution architecture
        env:
          EXPECTED_COMMIT: ${{ env.CANDIDATE_SHA }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const source = {
            candidateSha: process.env.EXPECTED_COMMIT,
            actualHead: git('rev-parse', 'HEAD'),
            tree: git('rev-parse', 'HEAD^{tree}'),
            prBaseSha: process.env.PR_BASE_SHA || null,
            prHeadSha: process.env.PR_HEAD_SHA || null,
            eventSha: process.env.EVENT_SHA,
            eventName: process.env.EVENT_NAME,
          };
          mkdirSync('test-results/ci-source', { recursive: true });
          writeFileSync('test-results/ci-source/linux.json', JSON.stringify(source, null, 2) + '\n');
          console.log(JSON.stringify(source));
          NODE
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"
          node -e 'if(process.platform!=="linux"||process.version!=="v24.21.0")throw Error("Expected Linux / Node 24.21.0"); console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch}))'
          test "$(pnpm --version)" = "10.34.6"
          python3 -c 'import sys, platform; assert sys.version_info[:2] == (3, 12); print(sys.version); print(platform.machine())'
      - run: pnpm install --frozen-lockfile
      - name: Check regression source and gate negative cases
        run: |
          pnpm exec eslint apps/service/src/guest-workspace.test.ts scripts/check-linux-guest.mjs scripts/check-linux-guest.test.mjs
          pnpm exec prettier --check apps/service/src/guest-workspace.test.ts scripts/check-linux-guest.mjs scripts/check-linux-guest.test.mjs .github/workflows/linux-guest.yml package.json
          node --test scripts/check-linux-guest.test.mjs
      - name: Require real Linux cleanup boundaries without skips
        run: pnpm test:linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-guest-${{ runner.arch }}-${{ env.CANDIDATE_SHA }}
          path: |
            test-results/linux-guest.json
            test-results/ci-source/linux.json
          if-no-files-found: error
          retention-days: 14
