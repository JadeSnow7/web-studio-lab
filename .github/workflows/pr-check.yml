# Scope and evidence contract: docs/development/pr-checks.md
name: PR head checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-head-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  offline-and-electron:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare file search tool
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
      - name: Validate the exact PR head in sequence
        run: node scripts/pr-check.mjs
      - name: Preserve reports, logs and failure context
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-head-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            test-results/pr-check/
            test-results/e2e/
            test-results/screens/
          if-no-files-found: error
          retention-days: 14
