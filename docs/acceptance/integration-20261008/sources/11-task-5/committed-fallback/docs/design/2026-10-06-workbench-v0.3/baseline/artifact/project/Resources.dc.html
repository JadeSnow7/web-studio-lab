<div class="w" style="width:1440px;height:900px;box-sizing:border-box;background:#F6F7F9;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;border:1px solid #D8DCE3;position:relative">

  <header style="height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;background:#F4F6FA;border-bottom:1px solid #D8DCE3">

    </button>

  <div style="flex:1;display:flex;min-height:0">
    <nav aria-label="Workshop" style="width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:#F4F6FA;border-right:1px solid #D8DCE3">
      <button style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#60656F;font-size:11px"><svg class="ic" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>首页</button>

      <button style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#60656F;font-size:11px"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></svg>会话</button>
      <button style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#60656F;font-size:11px"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="m8 12 3 3 5-6"></path></svg>任务</button>

        <button style="display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;font-size:13px"><svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px;color:#60656F"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"></path></svg>已收藏</button>
        <button style="display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;font-size:13px"><svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px;color:#60656F"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>最近</button>

        <button style="display:flex;justify-content:space-between;align-items:center;height:30px;padding:0 8px;border-radius:7px;background:#E3EDFA;color:#0A4F9E;font-size:13px;font-weight:600"><span>上线资料</span><span>4</span></button>
        <button style="display:flex;justify-content:space-between;align-items:center;height:30px;padding:0 8px;border-radius:7px;font-size:13px"><span>设计参考</span><span style="color:#60656F">9</span></button>
        <button style="display:flex;justify-content:space-between;align-items:center;height:30px;padding:0 8px;border-radius:7px;font-size:13px"><span>服务器</span><span style="color:#60656F">2</span></button>
      </div>
    </section>

    <main aria-label="资源列表" style="flex:1;min-width:0;padding:18px 22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px">
        <h1 style="margin:0;font-size:20px;font-weight:600;flex:1">上线资料</h1>
        <div style="display:flex;gap:6px;font-size:12px">
          <button style="padding:4px 10px;border-radius:12px;background:#1D1D1F;color:#FFFFFF">全部类型</button>
          <button style="padding:4px 10px;border-radius:12px;box-shadow:inset 0 0 0 1px #D8DCE3">文档</button>
          <button style="padding:4px 10px;border-radius:12px;box-shadow:inset 0 0 0 1px #D8DCE3">网页</button>
          <button style="padding:4px 10px;border-radius:12px;box-shadow:inset 0 0 0 1px #D8DCE3">终端位置</button>
        </div>
      </div>
      <div style="border-radius:10px;background:#FFFFFF;box-shadow:0 0 0 1px #D8DCE3;overflow:hidden;font-size:13px">

        <div style="display:grid;grid-template-columns:2fr 0.8fr 1.2fr 0.8fr;gap:8px;padding:11px 14px;border-top:1px solid #EDF0F4;align-items:center"><span>发布检查表</span><span>文档</span><span style="color:#60656F">—</span><span style="color:#60656F">r3</span></div>

        <div style="display:grid;grid-template-columns:2fr 0.8fr 1.2fr 0.8fr;gap:8px;padding:11px 14px;border-top:1px solid #EDF0F4;align-items:center"><span>监控面板</span><span>网页 · 收藏</span><span style="color:#60656F">—</span><span style="color:#60656F">9月</span></div>
      </div>
    </main>

      <div><div style="font-size:12px;color:#60656F">个人文档 · 原件</div><h2 style="margin:4px 0 0;font-size:17px;font-weight:600">验收清单</h2></div>
      <div style="display:flex;gap:8px"><button style="flex:1;height:32px;border-radius:8px;box-shadow:inset 0 0 0 1px #D8DCE3;font-size:13px">编辑原件</button><button style="flex:1;height:32px;border-radius:8px;background:#0A67D1;color:#FFFFFF;font-size:13px;font-weight:600">添加到空间…</button></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <h3 style="margin:0;font-size:13px;font-weight:600">有效权限</h3>
        <div style="display:grid;grid-template-columns:1fr auto;gap:6px;font-size:12px">
          <span>你</span><span style="color:#60656F">读 · 编辑 · 分享 · 资源本身</span>
          <span>上线资料组成员</span><span style="color:#60656F">读 · 来自资源组</span>
          <span>TaskFlow Agent</span><span style="color:#60656F">无（只能用副本）</span>

    </div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:#60656F">目标空间
      <select style="height:32px;border-radius:7px;border:1px solid #D8DCE3;padding:0 8px;font:inherit;font-size:13px;color:#1D1D1F;background:#FFFFFF"><option>TaskFlow</option><option>研究空间</option></select>
    </label>
    <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
      <legend style="font-size:12px;color:#60656F;padding:0;margin-bottom:6px">加入方式</legend>
      <label style="display:flex;gap:10px;padding:12px;border-radius:10px;box-shadow:inset 0 0 0 1.5px #0A67D1;background:#F1F6FD;cursor:pointer">
        <input type="radio" name="attach" checked="checked" style="margin-top:2px">
        <span style="display:flex;flex-direction:column;gap:3px"><span style="font-size:13px;font-weight:600">创建空间独立副本（推荐）</span><span style="font-size:12px;color:#3C4049;line-height:1.5">从 r12 复制。之后两边的修改互不影响；原件撤权不会自动收回这份副本。</span></span>
      </label>
      <label style="display:flex;gap:10px;padding:12px;border-radius:10px;box-shadow:inset 0 0 0 1px #D8DCE3;cursor:pointer">
        <input type="radio" name="attach" style="margin-top:2px">
        <span style="display:flex;flex-direction:column;gap:3px"><span style="font-size:13px;font-weight:600">持续引用原件 · 共享例外</span><span style="font-size:12px;color:#3C4049;line-height:1.5">TaskFlow 将实时读取你的个人原件，这个资源不再算作完全隔离。需要你确认共享范围。</span></span>
      </label>
    </fieldset>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button style="height:32px;padding:0 14px;border-radius:8px;box-shadow:inset 0 0 0 1px #D8DCE3;font-size:13px">取消</button>
      <button style="height:32px;padding:0 14px;border-radius:8px;background:#0A67D1;color:#FFFFFF;font-size:13px;font-weight:600">创建副本并打开</button>
