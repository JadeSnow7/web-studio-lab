<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>顶部地址浮层与 Workshop 展开</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.w{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}
.w button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace}
a{color:#0A67D1}a:hover{color:#08539F}
</style>
</helmet>
<div class="w" style="width:1440px;height:900px;box-sizing:border-box;background:#F6F7F9;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;border:1px solid #D8DCE3;position:relative">

  <header style="height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;background:#F4F6FA;border-bottom:1px solid #D8DCE3">
    <div aria-hidden="true" style="display:flex;gap:8px;width:72px;flex:none">
      <span style="width:12px;height:12px;border-radius:50%;background:#FF5F57"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#28C840"></span>
    </div>
    <nav aria-label="TaskFlow 空间的标签" style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;padding-left:8px">
      <button style="display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;background:#FFFFFF;box-shadow:0 0 0 2px #0A67D1;font-size:13px;font-weight:500">
        <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px;color:#0A67D1"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>
        项目网页
      </button>
      <button style="display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;font-size:13px;color:#3C4049">
        <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="m7 9 3 3-3 3M12 15h5"></path></svg>
        本地终端
      </button>
      <button style="display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;font-size:13px;color:#3C4049">
        <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4M9 12h6M9 16h6"></path></svg>
        验收文档
      </button>
    </nav>
    <button aria-label="通信面板" style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#60656F">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></svg>
    </button>
  </header>

  <main aria-label="Browser · 项目网页" style="flex:1;min-height:0;padding:10px 10px 10px 18px;display:flex">
    <section style="flex:1;border-radius:10px;background:#FFFFFF;box-shadow:0 0 0 1px #D8DCE3;padding:28px 32px 28px 360px;display:flex;flex-direction:column;gap:14px">
      <div style="font-size:20px;font-weight:600">任务看板</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">
        <div style="border-radius:10px;background:#F4F6FA;padding:14px;display:flex;flex-direction:column;gap:10px"><span style="font-size:12px;color:#60656F">待开始</span><span style="background:#FFFFFF;border-radius:8px;padding:10px;font-size:13px;box-shadow:0 0 0 1px #EDF0F4">结果验收</span></div>
        <div style="border-radius:10px;background:#F4F6FA;padding:14px;display:flex;flex-direction:column;gap:10px"><span style="font-size:12px;color:#60656F">进行中</span><span style="background:#FFFFFF;border-radius:8px;padding:10px;font-size:13px;box-shadow:0 0 0 1px #EDF0F4">移动端适配</span><span style="background:#FFFFFF;border-radius:8px;padding:10px;font-size:13px;box-shadow:0 0 0 1px #EDF0F4">完善首页</span></div>
        <div style="border-radius:10px;background:#F4F6FA;padding:14px;display:flex;flex-direction:column;gap:10px"><span style="font-size:12px;color:#60656F">已完成</span></div>
      </div>
    </section>
  </main>

  <div aria-hidden="true" style="position:absolute;left:0;top:44px;bottom:0;width:8px;display:flex;align-items:center;justify-content:center">
    <span style="width:3px;height:44px;border-radius:2px;background:#B8C0CC"></span>
  </div>

  <nav aria-label="Workshop（临时展开）" style="position:absolute;left:8px;top:52px;bottom:8px;width:324px;display:flex;border-radius:14px;background:rgba(244,246,250,0.92);backdrop-filter:blur(24px);box-shadow:0 0 0 1px #D8DCE3,0 18px 48px rgba(29,29,31,0.16);overflow:hidden">
    <div style="width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-right:1px solid #D8DCE3">
      <button style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#60656F;font-size:11px"><svg class="ic" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>首页</button>
      <button aria-current="page" style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#E3EDFA;color:#0A67D1;font-size:11px;font-weight:600"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>空间</button>
      <button style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#60656F;font-size:11px"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"></path></svg>资源</button>
      <button style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#60656F;font-size:11px"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></svg>会话</button>
      <button style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#60656F;font-size:11px"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="m8 12 3 3 5-6"></path></svg>任务</button>
      <div style="flex:1"></div>
      <button aria-label="固定 Workshop（未固定）" style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#60656F"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3z"></path><path d="M12 13v7"></path></svg></button>
      <button style="width:48px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#60656F;font-size:11px"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>设置</button>
    </div>
    <div style="flex:1;min-width:0;padding:12px 10px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;padding:0 4px"><span style="font-size:15px;font-weight:600;flex:1">空间</span><span style="font-size:11px;color:#60656F">⌘B 显示/隐藏</span></div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;align-items:center;gap:4px;height:36px;padding:0 4px 0 6px;border-radius:8px;background:#FFFFFF;box-shadow:0 0 0 1px #C9D5E6">
          <button aria-label="收起 TaskFlow" style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#60656F"><svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button style="flex:1;text-align:left;font-size:13px;font-weight:600">TaskFlow</button>
          <button aria-label="新建页面" title="新建页面" style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#3C4049"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg></button>
          <button aria-label="添加已有资源" title="添加已有资源" style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#3C4049"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></button>
          <button aria-label="新建本空间会话" title="新建会话" style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#3C4049"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M4 5h16v11H9l-5 4z"></path></svg></button>
          <button aria-label="更多操作" style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#3C4049;font-size:15px;line-height:1">···</button>
        </div>
        <div style="padding-left:28px;display:flex;flex-direction:column;gap:1px">
          <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;font-size:13px;background:#E3EDFA;color:#0A4F9E"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>项目网页</div>
          <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;font-size:13px"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px;color:#60656F"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="m7 9 3 3-3 3M12 15h5"></path></svg>本地终端</div>
          <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;font-size:13px"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px;color:#60656F"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4M9 12h6M9 16h6"></path></svg>验收文档</div>
        </div>
        <div style="display:flex;align-items:center;gap:4px;height:36px;padding:0 6px;border-radius:8px">
          <button aria-label="展开研究空间" style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#60656F"><svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="m9 6 6 6-6 6"></path></svg></button>
          <span style="font-size:13px">研究空间</span>
        </div>
      </div>
      <div style="margin-top:auto;font-size:11.5px;color:#60656F;line-height:1.5;padding:0 4px">展开箭头只影响树；点名称才进入空间。行按钮也能从「更多」菜单和键盘到达。</div>
    </div>
  </nav>

  <section aria-label="地址与命令" style="position:absolute;left:400px;top:52px;width:640px;border-radius:14px;background:rgba(244,246,250,0.96);backdrop-filter:blur(24px);box-shadow:0 0 0 1px #D8DCE3,0 18px 48px rgba(29,29,31,0.18);overflow:hidden">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #D8DCE3">
      <svg class="ic" viewBox="0 0 24 24" style="color:#60656F"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
      <label for="addr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">地址或命令</label>
      <input id="addr" class="mono" value="localhost:5173/settings" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:#1D1D1F">
      <span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #0A67D1;color:#0A4F9E;font-size:12px;font-weight:600;white-space:nowrap">打开到：项目网页</span>
    </div>
    <div style="padding:6px;display:flex;flex-direction:column;gap:2px;font-size:13px">
      <div style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;background:#0A67D1;color:#FFFFFF">
        <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>
        <span style="flex:1">在「项目网页」中打开 <span class="mono">localhost:5173/settings</span></span><span style="font-size:12px;opacity:0.85">↵</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px">
        <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px;color:#60656F"><path d="M12 5v14M5 12h14"></path></svg>
        <span style="flex:1">在新 Tab 中打开</span><span style="font-size:12px;color:#60656F">⌘↵</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px">
        <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px;color:#60656F"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <span style="flex:1">在本空间资源中搜索「settings」</span>
      </div>
      <div style="height:1px;background:#D8DCE3;margin:4px 6px"></div>
      <div style="padding:4px 10px 2px;font-size:11px;color:#60656F;font-weight:600">输入 &gt; 进入命令模式</div>
      <div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px">
        <span class="mono" style="color:#60656F;width:15px;text-align:center">&gt;</span>
        <span style="flex:1">向右平铺 · 项目网页</span><span style="font-size:12px;color:#60656F">菜单：窗口 › 平铺</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px">
        <span class="mono" style="color:#60656F;width:15px;text-align:center">&gt;</span>
        <span style="flex:1">折叠此页 · 项目网页</span>
      </div>
    </div>
    <div style="display:flex;gap:16px;padding:8px 14px;border-top:1px solid #D8DCE3;font-size:11.5px;color:#60656F">
      <span>⌘L 地址</span><span>⌘K 命令</span><span>Esc 先关候选，再退出编辑</span><span style="flex:1"></span><span>目标在开始编辑时锁定</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
